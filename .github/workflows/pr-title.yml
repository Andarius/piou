name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      # squash merges use the PR title as the commit message, which drives the release bump
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9_-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a conventional commit, e.g. 'fix: ...' or 'feat(tui): ...'. Got: $TITLE"
            exit 1
          fi
