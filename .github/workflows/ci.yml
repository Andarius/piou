name: CI

on:
  push:
    branches:
      - master
      - main
    tags-ignore:
      - '**'
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.6"
          enable-cache: true
          
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
        
      - name: Running lint check
        run: uv run ruff check .
        
      - name: Check format
        run: uv run ruff format --check .
        
      - name: Running type checking
        run: uv run pyright
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: true
          
      - name: Run tests
        run: uv run pytest -vv --junitxml=tests/junit.xml
        
      - name: Test Example
        run: bash ./bin/run-examples.sh
        
      - name: Generating coverage
        run: |
          uv run coverage xml -o tests/coverage.xml
          uv run coverage html
          
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov

      - name: Upload snapshot report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-report-${{ matrix.python-version }}
          path: snapshot_report.html
